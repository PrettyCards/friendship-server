# Feildmaster is the actual mastermind behind this, as usual. :P

name: Twice a Day Update
on:
  workflow_dispatch:
  schedule:
    - cron: "22 6,18 * * *" # About 1 hour before reset
jobs:
  run:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Node setup
        uses: actions/setup-node@v2-beta
        with:
          node-version: '12'
      - name: Install
        run: npm install --production
      - name: Update
        run: npm start hourly
      - name: Commit
        uses: EndBug/add-and-commit@v5
        with:
          author_name: Trackbot
          message: "chore: Hourly Update"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
